content: >-
  Kommunistiska Partiet går till val 2026 med ett tydligt krav: välfärd,
  bostäder, jobb och trygghet måste prioriteras framför militarism och
  vinstjakt. Vi kräver att våra skattepengar går till vård, skola, omsorg och
  kollektivtrafik, att hyrorna sänks och att Sverige lämnar Nato och protesterar
  mot Israels folkmord. Det är vanliga människors behov som ska styra politiken,
  inte kapitalets jakt på profit.


  Klassklyftorna ökar, arbetslösheten är kvar på skyhöga nivåer och majoriteten
  av regionerna och en tredjedel av alla kommuner går med underskott. Samtidigt
  har anslagen till militären ökat med närmare 300 procent de senaste tio åren.
  Vi vill vända på utvecklingen, vi säger välfärd, inte vapen!


  Istället för att gå USA:s ärenden globalt borde Sverige vara en röst för fred,
  solidaritet och rättvisa. Sverige har givit upp sin självständighet för att
  låta EU och Nato diktera den svenska politiken. Kommunistiska Partiet arbetar
  för internationell solidaritet, för att folkmordssaten Israel ska bojkottas
  och för Sverige ska lämna EU och Nato.


  Hela Kommunistiska Partiets partiprogram kan du läsa
  [här](https://kommunisterna.org/politik/partiprogram).


  Du kan rösta på Kommunistiska Partiet i [18 kommunval och ett
  regionval](https://val.kommunisterna.org/#har-staller-vi-upp). Om du inte
  hittar våra valsedlar i vallokalen kan du  ta en blank valsedel och skriva
  "Kommunistiska Partiet" på den. Läs mer om de lokala valkampanjerna nedan.
