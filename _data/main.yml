content: |-
  Kommunistiska Partiet går till val 2026 med ett tydligt krav: välfärd, bostäder och trygghet måste prioriteras framför militarism och vinstjakt.
  Vi kräver att skattepengar går till vård, skola, omsorg och kollektivtrafik, att hyrorna sänks och att Sverige dras ur Nato och all krigsberedskap.
  Det är arbetarnas och vanliga människors liv som ska styra politiken, inte kapitalets profit.
