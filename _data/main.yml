content: >-
  Kommunistiska Partiet går till val 2026 med ett tydligt krav: välfärd,
  bostäder och trygghet måste prioriteras framför militarism och vinstjakt. Vi
  kräver att våra skattepengar går till vård, skola, omsorg och kollektivtrafik,
  att hyrorna sänks och att Sverige dras ur Nato och all krigsberedskap. Det är
  arbetarnas och vanliga människors liv som ska styra politiken, inte kapitalets
  profit.


  Sverige utvecklas åt fel håll. Klassklyftorna ökar, arbetslösheten är kvar på
  skyhöga nivåer och majoriteten av våra landsting och en tredjedel av alla
  kommuner går med underskott. Samtidigt har pengarna till militären ökat med
  närmare 300 procent de senaste tio åren. Kommunistiska Partiet arbetar för att
  vända på utvecklingen, vi säger välfärd, inte vapen!


  Sverige är en del av världen och där vi blivit en röst för splittring,
  konfrontation och upprustning i stället för att arbeta för fred, solidaritet
  och rättvisa. Sverige har givit upp sin självständighet för att låta EU och
  Nato diktera den svenska politiken. Kommunistiska Partiet arbetar för
  internationell solidaritet, för att folkmordssaten Israel ska bojkottas och
  isoleras och för Sverige ska lämna EU och Nato.
