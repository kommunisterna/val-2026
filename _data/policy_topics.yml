policy_topics:
  - title: Allmännyttan
    description: Stoppa utförsäljningarna. Bostad ska vara en social rättighet, inte
      ett vinstobjekt.
    link: https://proletaren.se/artikel/sa-andrades-lagen-for-att-ge-hyresbolagen-okade-vinster/
  - title: Arbetskraftsinvandring
    description: Svenska kollektivavtal ska gälla alla som jobbar här. Stopp för
      social dumpning.
    link: https://proletaren.se/artikel/lonedumpning-i-kapitalets-tjanst/
  - title: Arbetslöshet
    description: Arbete åt alla. Höjd a-kassa, stopp för utförsäkringarna och kamp
      mot varslen.
    link: https://proletaren.se/artikel/det-gar-att-fa-bort-arbetslosheten/
  - title: Arbetstid
    description: Sex timmars arbetsdag med bibehållen lön.
    link: https://proletaren.se/artikel/argumenten-ar-sagda-tid-for-sextimmarsdag/
  - title: Asyl & flyktingar
    description: Värna asylrätten och individuell prövning. Staten ska ta ansvaret.
    link: https://proletaren.se/artikel/tonarsutvisningar-och-lonedumpning-ar-cynisk-klasspolitik/
  - title: Bojkotta Israel
    description: Vi kräver total bojkott av folkmordsstaten Israel.
    link: https://proletaren.se/artikel/en-solidaritetsrorelse-vaxer-fram
  - title: Bostad
    description: Befria bostaden från marknaden. Bygg billiga hyresrätter, stoppa
      hyreshöjningarna.
    link: https://proletaren.se/artikel/vara-hem-ska-inte-vara-investeringsobjekt/
  - title: DCA-avtalet
    description: Säg upp DCA-avtalet. Inga svenska baser åt USA:s krigsmakt.
    link: https://proletaren.se/artikel/rusta-upp-valfarden-inte-krigsmakten
  - title: Deltagardemokrati
    description: Politik är mer än att rösta vart fjärde år.
    link: https://proletaren.se/artikel/automatiskt-utkast-28/
  - title: Droger
    description: "Ett narkotikafritt samhälle: hårt mot profitörerna, human vård för
      den som fastnat i beroende."
    link: https://proletaren.se/artikel/ett-narkotikafritt-samhalle/
  - title: Elpriser
    description: Förstatliga elmarknaden. Inför Sverigepriser.
    link: https://proletaren.se/artikel/kan-norge-kan-sverige-hog-tid-ett-nationellt-pris-pa-el/
  - title: EU
    description: Sverige ut ur EU. Unionen är lagstadgad högerpolitik.
    link: https://proletaren.se/artikel/vi-later-oss-fortfarande-inte-luras/
  - title: Facket
    description: Skrota "märket", kämpa för rejäla lönehöjningar.
    link: https://proletaren.se/artikel/forsakringsbolag-eller-kampande-fackforening/
  - title: Fred
    description: Välfärd istället för vapen.
    link: https://proletaren.se/artikel/valfard-istallet-vapen
  - title: Friskolor
    description: Skattepengar ska gå till eleverna, inte till vinst.
    link: https://proletaren.se/artikel/elever-ska-inte-vara-kunder/
  - title: Gängkriminalitet
    description: Bekämpa rotorsakerna — nedskärningar och segregation.
    link: https://proletaren.se/artikel/13-aringar-i-fangelse/
  - title: Hedersförtryck
    description: En grov form av patriarkat. Ska bekämpas.
    link: https://proletaren.se/artikel/bara-att-de-ar-kvinnor/
  - title: Hyror
    description: Sänk hyrorna. Halva lönen i hyra är fel på systemet.
    link: https://proletaren.se/artikel/en-bostadsmarknad-rika/
  - title: Idrott & föreningsliv
    description: Idrott och kultur åt alla, mot kommersialisering.
    link: https://proletaren.se/artikel/fredsloppet-vaxer-fler-springer-mot-krig-och-upprustning/
  - title: Internationell solidaritet
    description: Solidaritet med de folk som bombas, ockuperas och hotas.
    link: https://proletaren.se/artikel/forsta-maj-i-solidaritetens-tecken/
  - title: Jämställdhet
    description: Lika lön för likvärdigt arbete och rätt till heltid.
    link: https://proletaren.se/artikel/lika-viktig-kamp-da-som-nu/
  - title: Klimat
    description: Klimatkrisen löses inte med marknadens verktyg.
    link: https://proletaren.se/artikel/klimatkrisen-ar-en-klassfraga/
  - title: Kollektivtrafik
    description: Förstatliga kollektivtrafiken.
    link: https://proletaren.se/artikel/satsa-pa-kollektivtrafiken-gor-regeringens-prissankning-permanent/
  - title: Kuba
    description: Vi försvarar Kuba mot USA:s blockad.
    link: https://proletaren.se/artikel/nu-ar-det-kuba-som-behover-solidaritet/
  - title: Kultur
    description: Höjda anslag till kultur och folkbildning.
    link: https://proletaren.se/artikel/ge-oss-okade-anslag-istallet-for-tuktelse/
  - title: Kärnkraft
    description: Avveckla kärnkraften, satsa på förnybart.
    link: https://proletaren.se/artikel/kina-visar-att-klimatomstallningen-kraver-planering/
  - title: Lika lön
    description: Lika lön för lika arbete för alla som arbetar i Sverige.
    link: https://proletaren.se/artikel/dags-att-hoja-kvinnors-loner/
  - title: Militärutgifter
    description: Hundratals miljarder går till militären medan välfärden skär ner.
      Stoppa miljardrullningen till militären!
    link: https://proletaren.se/artikel/det-befasta-fattighuset/
  - title: Monarki & republik
    description: Avskaffa monarkin och inför republik.
    link: https://proletaren.se/artikel/kungahusets-verkliga-kostnad-13-miljarder-kronor/
  - title: Nato
    description: Sverige ur Nato. För alliansfrihet och fred.
    link: https://proletaren.se/artikel/rusta-upp-valfarden-inte-krigsmakten
  - title: Organisera dig
    description: Det viktigaste valet är att organisera sig.
    link: https://kommunisterna.org/organisation/bli-medlem
  - title: Palestina
    description: Vi står helhjärtat med det palestinska folket mot ockupation,
      apartheid och folkmord.
    link: https://proletaren.se/artikel/fran-floden-till-havet-palestina-ska-bli-fritt/
  - title: Pensionsålder
    description: Nej till höjd pensionsålder. Sänk den.
    link: https://proletaren.se/artikel/det-stora-pensionsbedrageriet/
  - title: Politikerprivilegier
    description: Folkvalda ska inte tjäna mer än en arbetarlön.
    link: https://proletaren.se/artikel/automatiskt-utkast-28/
  - title: Privatisering
    description: Kasta ut kapitalismen ur välfärden.
    link: https://proletaren.se/artikel/det-behovs-frisk-luft-i-kommunpolitiken/
  - title: Rasism
    description: Alla människors lika värde. Krossa rasismen!
    link: https://proletaren.se/artikel/fascism-och-hogerpolitik-stoppas-pa-gatorna/
  - title: Riksdagspartierna
    description: Åttaklövern är överens om upprustning och nedskärningar.
    link: https://proletaren.se/artikel/regeringsmakten-ar-allt-malet-intet/
  - title: Röda linjer
    description: Arbetares och vanligt folks bästa kompromissas inte bort.
    link: https://proletaren.se/artikel/de-roda-linjernas-parti/
  - title: Sexköp & porr
    description: Stöd för sexköpsförbudet. Mot exploatering av kvinnors kroppar.
    link: https://proletaren.se/artikel/porr-ar-inte-forenligt-med-kvinnlig-frigorelse/
  - title: Sjukvård
    description: Vården ska styras av behov, inte budgetramar.
    link: https://proletaren.se/artikel/valfard-istallet-vapen
  - title: Skatt
    description: Skatt efter bärkraft. Återinför förmögenhets- och arvsskatt.
    link: https://proletaren.se/artikel/vad-ska-vi-gora-de-svenska-oligarkerna/
  - title: Skola
    description: En sammanhållen, likvärdig skola.
    link: https://proletaren.se/artikel/elever-ska-inte-vara-kunder/
  - title: Socialism
    description: Gemensamt ägande och människors behov i stället för fåtalets vinstjakt.
    link: https://proletaren.se/artikel/vi-later-oss-inte-mutas/
  - title: Strejkrätt
    description: Försvara den fria strejkrätten.
    link: https://proletaren.se/artikel/lita-inte-pa-fackpamparna/
  - title: USA
    description: En allians med en krigsgalen stormakt är vansinne.
    link: https://proletaren.se/artikel/usas-och-israels-krig-drabbar-alla-varldens-arbetare/
  - title: Vapenexport
    description: Förbjud vapenexporten.
    link: https://proletaren.se/artikel/valfarden-forst-militaren-sist/
  - title: Välfärd
    description: Satsa på vård, skola, omsorg — inte vapen.
    link: https://proletaren.se/artikel/valfard-istallet-vapen
  - title: Värnplikt
    description: Avskaffa yrkesarmén, allmän värnplikt.
    link: https://proletaren.se/artikel/ett-starkt-samhalle-ar-vart-basta-forsvar/
  - title: Yttrandefrihet
    description: Försvara de demokratiska fri- och rättigheterna.
    link: https://proletaren.se/artikel/borgerligt-paradigmskifte-inom-rattspolitiken/
  - title: Återförstatligande
    description: Ta tillbaka el, järnväg, post och apotek i gemensam ägo.
    link: https://proletaren.se/artikel/attackerna-pa-valfarden-ar-klasspolitik/
  - title: Äldreomsorg
    description: Slut på svältkuren. Fler händer, behoven först.
    link: https://proletaren.se/artikel/nej-till-militar-upprustning-pengarna-till-valfarden/
  - title: Överklassen
    description: Vi svansar aldrig för överklassen.
    link: https://proletaren.se/artikel/jacob-wallenberg-ser-ner-pa-de-som-skapar-hans-valstand/
