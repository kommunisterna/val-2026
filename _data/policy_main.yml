content: |-
  ## Innehåll — fylls i av redaktionen

  **Välfärd inte vapen:** Satsa på vård, skola, omsorg och kollektivtrafik — inte på militarism och upprustning.

  **Sänk hyran:** Hyresrätt ska vara en social rättighet, inte ett vinstobjekt.

  **Bojkotta Israel:** Vi kräver total bojkott av folkmordsstaten Israel och solidaritet med det palestinska folket. Läs mer i [Proletären](https://proletaren.se/artikel/en-solidaritetsrorelse-vaxer-fram).
