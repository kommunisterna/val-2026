content: >-
  **Välfärd inte vapen:**

  Sverige har en välfärd i kris samtidigt som miljardrullningen till militären
  och upprustning bara fortsätter. Årets försvarsbudget uppgår till 175
  miljarder kronor, vilket är en ökning med nästan 20 procent jämfört med 2025.
  Inte ens sådana astronomiska summor räcker för riksdagspartierna. Alla från
  Vänsterpartiet till Sverigedemokraterna är överens om att anslagen till
  militären 2030 ska uppgå till 186 miljarder kronor.


  Natokravet på att Sverige ska satsa två procent av BNP på militären har
  överträffats med råge – i all inställsamhet till herrarna i Washington och
  Bryssel har de svenska politikerna höjt andelen till 2,6 procent. Till 2035
  kräver Nato t.o.m. att 5 procent av medlemsstaternas BNP ska gå till denna.
  Det är mer än en fjärdedel av hela statsbudgeten i Sverige.


  Upprustningen och Natomedlemskapet har ökat, inte minskat, krigsrisken. På
  samma sätt kommer inte de ökade satsningarna på militären göra samhället mer
  stabilt eller motståndskraftigt mot kriser. Tvärtom innebär resursöverföringen
  från välfärd till vapen att kriserna som svenska arbetare står inför
  fördjupas. Dessa kriser kommer nämligen inte i första hand från främmande
  makter, utan är ett resultat av en medveten politik för att gynna svenska
  kapitalister.


  Till krig och upprustning finns uppenbarligen hur mycket pengar som helst. För
  välfärden är det däremot fortsatt svältkur som gäller. Skulle ens en femtedel
  av alla pengar som slösas på militären istället läggas som välfärdspengar till
  våra kommuner och regioner hade den pågående krisen stoppats upp och
  nödvändiga satsningar kunnat påbörjas.


  Samtidigt som pengarna flödar obehindrat till krig och vapen så går välfärden
  på knäna och fattigdomen breder ut sig. Varje svensk måste ställa sig frågan:
  vad hade en jämförbar satsning på skola, vård och omsorg kunnat innebära?
  Varför finns pengar till krig men inte till välfärd?


  Så här kan vi helt enkelt inte ha det. När politikerna övergett oss måste vi
  själva ta kontrollen över vår tillvaro. Vi måste ställa oss frågan vilken
  framtid vi vill ha – välfärd eller vapen?


  Vi vet vad vi svarar. Välfärd, inte vapen! Satsa på vård, skola, omsorg och
  kollektivtrafik — inte på militarism och upprustning.


  **Sänk hyran:**

  Sverige befinner sig i en bostadskris. Över hälften av landets befolkning bor
  i kommuner med bostadsbrist. Bostadsbyggandet håller inte samma takt som vare
  sig efterfrågan eller behovet, och de nya bostäder som byggs har inte sällan
  alltför höga hyror för att vanliga arbetande människor ska kunna bo där.


  Bostadshyrorna har ökat dramatiskt de senaste åren. Många fastighetsägare,
  både privata och kommunala, har aviserat hyreshöjningar runt tio procent och
  högre. En sådan hyreshöjning skulle innebära 700 kronor mer i månaden för en
  genomsnittlig hyresgäst. Bor man i en nyrenoverad eller ny lägenhet handlar
  det om upp till 2 000 kronor mer i månaden. Det förstår vem som helst att
  många inte har råd att betala. Samtidigt genomförs stora hyreshöjningar i det
  existerande bostadsbeståndet. 2025 höjdes genomsnittshyran med 4,6 procent. I
  storstadsregionerna ligger den genomsnittliga hyran nu på över 10 000 kronor i
  månaden. Situationen är ohållbar.


  Hyresgäster drabbas hårdare än andra grupper av prisökningarna i samhället.
  Hyresgästföreningen har visat att hyresgäster i genomsnitt har lägre inkomster
  än de som äger sina bostäder, och att den här skillnaden har ökat under de
  senaste två decennierna. Samtidigt subventionerar staten rika, ägande hushåll
  genom ränteavdraget. Nästan hälften av detta gick till den rikaste fjärdedelen
  av befolkningen.


  För ett rättvist boende krävs att bostadspolitiken befrias från marknaden.
  Tillgång till ett bra och tryggt boende är en mänsklig rättighet. Därför måste
  fler, billiga hyresrätter byggas och spekulanterna slängas ut från
  bostadsmarknaden helt och hållet. Stat och kommun ska ta ansvar för alla led i
  bostadsförsörjningen, från finansiering, byggande och reparationer till
  uthyrning och hyressättning. Hyrorna måste frysas och sänkas. Lösningen på
  bostadsbristen är att bygga fler, billiga hyresrätter – att slänga ut
  spekulanter och slumlords från bostadsmarknaden helt och hållet. Hyrorna inte
  bara frysas på nuvarande nivå, utan även sänkas. Alla ska ha rätt till ett
  tryggt och bra boende.


  2025 fanns det drygt 846 000 lägenheter i det allmännyttiga bostadsbeståndet,
  vilket motsvarar cirka 41 procent av hyresrättsbeståndet. I många kommuner
  äger det kommunala bostadsbolaget en betydande del av bostadsbeståndet.


  Samtidigt fortsätter allmännyttans andel av bostadsmarknaden att krympa i takt
  med att allmännyttiga hyreslägenheter säljs till högstbudande. De privata
  hyresvärdar som köper upp beståndet använder sig inte sällan av renovräkningar
  – överflödiga, påkostade renoveringar som trissar upp hyrorna och driver ut
  hyresgästerna.


  Allmännyttan ska värnas. När marknadens logik regerar tvingas arbetare ut på
  gatan, medan bostadskapitalisterna gör rekordvinster. Målet för de kommunala
  bostadsbolagens verksamhet ska vara att tillhandahålla bostäder till rimliga
  priser, inte att gå med vinst.


  Hyresrätt ska vara en social rättighet, inte ett vinstobjekt.


  **Bojkotta Israel:** Vi kräver total bojkott av folkmordsstaten Israel och
  solidaritet med det palestinska folket. Läs mer i
  [Proletären](https://proletaren.se/artikel/en-solidaritetsrorelse-vaxer-fram).
