title: City People
description: Discover people in cities around the world
url: ""
baseurl: ""

collections:
  cities:
    output: true
    permalink: /:slug/
  people:
    output: false

defaults:
  - scope:
      path: ""
      type: "cities"
    values:
      layout: "city"

plugins:
  - jekyll-seo-tag

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - .pages.yml
