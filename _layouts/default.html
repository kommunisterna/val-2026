<body class="html {% if page.url == '/' %}front{% endif %}">
  <div id="skip-link">
    <a href="#main-content" class="element-invisible element-focusable">Hoppa till huvudinnehåll</a>
  </div>

  <div id="header-wrapper">
    <div id="site-header" class="grid grid-pad">
      <div class="inner">
        <div class="site-header-logo col-5-12">
          <a href="{{ '/' | relative_url }}">
            <img src="{{ site.logotype }}" alt="Kommunistiska Partiet">
          </a>
        </div>
        <div class="site-header-nav col-7-12">
          <ul class="menu">
            {% for city in site.cities %}
            <li><a href="{{ city.url | relative_url }}">{{ city.title }}</a></li>
            {% endfor %}
          </ul>
        </div>
      </div>
    </div>
  </div>

  <a id="main-content"></a>

  {{ content }}

  <div id="footer-wrapper">
    <div id="footer" class="grid grid-pad">
      <div id="footer-region" class="col-1-1">
        <p>{{ site.title }} &mdash; {{ site.description }}</p>
      </div>
    </div>
  </div>
</body>
</html>
