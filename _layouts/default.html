<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} | {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
  {% seo %}
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: #f6f6ef;
      font-family: Verdana, Geneva, sans-serif;
      font-size: 10pt;
      color: #000000;
    }

    a {
      color: #000000;
      text-decoration: none;
    }

    a:visited {
      color: #828282;
    }

    a:hover {
      text-decoration: underline;
    }

    .site-header {
      background-color: #ff6600;
      padding: 2px 10px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .site-header .site-title {
      font-weight: bold;
      color: #000000;
      font-size: 13pt;
      text-decoration: none;
    }

    .site-header .site-title:visited {
      color: #000000;
    }

    .site-header nav {
      display: flex;
      gap: 7px;
      align-items: center;
    }

    .site-header nav a {
      color: #000000;
      font-size: 10pt;
    }

    .site-header nav a:visited {
      color: #000000;
    }

    .site-header nav .separator {
      color: #000000;
    }

    .site-content {
      padding: 10px;
      max-width: 85%;
    }

    .city-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 20px;
      margin-top: 10px;
    }

    .city-card {
      border: 1px solid #ddd;
      background: #fff;
      overflow: hidden;
    }

    .city-card img {
      width: 100%;
      height: 160px;
      object-fit: cover;
      display: block;
    }

    .city-card .city-card-body {
      padding: 10px;
    }

    .city-card .city-card-body h2 {
      font-size: 11pt;
      margin-bottom: 4px;
    }

    .city-card .city-card-body p {
      font-size: 9pt;
      color: #828282;
    }

    .city-header {
      margin-bottom: 15px;
    }

    .city-header h1 {
      font-size: 14pt;
      margin-bottom: 5px;
    }

    .city-header .city-description {
      color: #828282;
      font-size: 9pt;
      margin-bottom: 10px;
    }

    .city-header img {
      width: 100%;
      max-height: 300px;
      object-fit: cover;
      display: block;
      margin-bottom: 10px;
    }

    .city-body {
      margin-bottom: 20px;
      line-height: 1.4;
    }

    .city-body p {
      margin-bottom: 10px;
    }

    .people-section h2 {
      font-size: 11pt;
      margin-bottom: 10px;
      border-bottom: 1px solid #ddd;
      padding-bottom: 5px;
    }

    .people-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 15px;
    }

    .person-card {
      text-align: center;
    }

    .person-card img {
      width: 100px;
      height: 100px;
      object-fit: cover;
      border-radius: 50%;
      display: block;
      margin: 0 auto 8px;
    }

    .person-card .person-name {
      font-size: 9pt;
      font-weight: bold;
    }

    .site-footer {
      border-top: 2px solid #ff6600;
      margin-top: 20px;
      padding: 10px;
      text-align: center;
      color: #828282;
      font-size: 8pt;
    }
  </style>
</head>
<body>
  <header class="site-header">
    <a class="site-title" href="{{ '/' | relative_url }}">{{ site.title }}</a>
    <nav>
      {% for city in site.cities %}
      <span class="separator">|</span>
      <a href="{{ city.url | relative_url }}">{{ city.title }}</a>
      {% endfor %}
    </nav>
  </header>

  <main class="site-content">
    {{ content }}
  </main>

  <footer class="site-footer">
    <p>{{ site.title }} &mdash; {{ site.description }}</p>
  </footer>
</body>
</html>
