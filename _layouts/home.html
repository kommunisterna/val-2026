---
layout: default
---

<div class="city-grid">
  {% for city in site.cities %}
  <a class="city-card" href="{{ city.url | relative_url }}">
    {% if city.cover_image %}
    <img src="{{ city.cover_image | relative_url }}" alt="{{ city.title }}">
    {% endif %}
    <div class="city-card-body">
      <h2>{{ city.title }}</h2>
      {% if city.description %}<p>{{ city.description }}</p>{% endif %}
    </div>
  </a>
  {% endfor %}
</div>
