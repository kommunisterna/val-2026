media: assets/media

content:
  - name: cities
    label: Kommuner
    type: collection
    path: _cities
    format: yaml-frontmatter
    view:
      primary: title
      fields:
        - title
        - email
        - website
      sort: [title]
      default:
        sort: title
        order: asc
    fields:
      - name: title
        label: Titel
        type: string
        required: true
      - name: email
        label: E-post
        type: string
      - name: website
        label: Webbsida
        type: string
      - name: coordinates
        label: Koordinater
        type: number
        list: true
        min: 2
        max: 2
      - name: body
        label: Brödtext
        type: rich-text
      - name: candidate_lists
        label: Kandidatlistor
        type: object
        list:
          collapsible:
            summary: "{title}"
        fields:
          - name: title
            label: Titel
            type: string
            required: true
          - name: flyer
            label: Flygblad
            type: file
            options:
              extensions:
                - pdf
              path: assets/media/valflygblad
          - name: flyer_thumb
            label: Flygblad framsida
            type: image
            options:
              extensions:
                - webp
              path: assets/media/valflygblad
          - name: ballot
            label: Valsedel
            type: image
            options:
              extensions:
                - png
              path: assets/media/valsedlar
          - name: candidates
            label: Kandidater
            type: string
            list: true

  - name: main
    label: Huvudtext
    type: file
    path: _data/main.yml
    format: yaml
    fields:
      - name: content
        label: Innehåll
        type: rich-text

  - name: policy_main
    label: Våra viktigaste frågor
    type: file
    path: _data/policy_main.yml
    format: yaml
    fields:
      - name: content
        label: Innehåll
        type: rich-text

  - name: policy_topics
    label: Politik A–Ö
    type: file
    path: _data/policy_topics.yml
    format: yaml
    fields:
      - name: policy_topics
        label: Politikposter
        type: object
        list: true
        fields:
          - name: title
            label: Rubrik
            type: string
            required: true
          - name: description
            label: Beskrivning
            type: text
            required: true
          - name: link
            label: Länk (valfri)
            type: string

  - name: settings
    label: Sidinställningar
    type: file
    path: _config.yml
    format: yaml
    fields:
      - name: title
        label: Sidtitel
        type: string
      - name: description
        label: Sidbeskrivning
        type: string
      - name: url
        label: Sidans URL
        type: string
