media: assets/media

content:
  - name: cities
    label: Kommuner
    type: collection
    path: _cities
    format: yaml-frontmatter
    view:
      primary: title
      fields:
        - title
        - description
    fields:
      - name: title
        label: Titel
        type: string
        required: true
      - name: description
        label: Beskrivning
        type: string
      - name: cover_image
        label: Omslagsbild
        type: image
      - name: body
        label: Brödtext
        type: rich-text

  - name: people
    label: Kandidater
    type: collection
    path: _people
    format: yaml-frontmatter
    view:
      primary: full_name
      fields:
        - full_name
        - city
    fields:
      - name: full_name
        label: Namn
        type: string
        required: true
      - name: ballot_position
        label: Plats i valsedeln
        type: number
        required: true
      - name: photo
        label: Foto
        type: image
        required: false
      - name: city
        label: Kommun
        type: reference
        required: true
        options:
          collection: cities
          value: "{slug}"
          label: "{title}"

  - name: settings
    label: Sidinställningar
    type: file
    path: _config.yml
    format: yaml
    fields:
      - name: title
        label: Sidtitel
        type: string
      - name: description
        label: Sidbeskrivning
        type: string
      - name: url
        label: Sidans URL
        type: string
