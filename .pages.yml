media: assets/media

content:
  - name: cities
    label: Cities
    type: collection
    path: _cities
    format: yaml-frontmatter
    view:
      primary: title
      fields:
        - title
        - description
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: description
        label: Description
        type: string
      - name: cover_image
        label: Cover Image
        type: image
      - name: body
        label: Body
        type: rich-text

  - name: people
    label: People
    type: collection
    path: _people
    format: yaml-frontmatter
    view:
      primary: name
      fields:
        - name
        - city
    fields:
      - name: name
        label: Name
        type: string
        required: true
      - name: photo
        label: Photo
        type: image
        required: true
      - name: city
        label: City
        type: reference
        required: true
        options:
          collection: cities
          value: "{slug}"
          label: "{title}"

  - name: settings
    label: Site Settings
    type: file
    path: _config.yml
    format: yaml
    fields:
      - name: title
        label: Site Title
        type: string
      - name: description
        label: Site Description
        type: string
      - name: url
        label: Site URL
        type: string
